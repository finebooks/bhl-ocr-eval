name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        # Pin uv so `uv sync --locked` validates uv.lock with the same resolver that generated it.
        # Bump this together with a `uv lock` refresh, never on its own.
        with:
          version: "0.9.27"
      # Installs the scoring core + the `dev` group (pytest/hypothesis/pandas) from pyproject +
      # uv.lock. --locked fails if the lockfile is stale, so deps can't drift silently.
      - run: uv sync --locked
      - run: uv run pytest

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.27"
      # Type-check first-party signatures (catches cross-module arity/signature breaks that pytest
      # and ruff miss). Pinned — ty is preview software; bump deliberately. Config in ty.toml.
      - run: uvx ty@0.0.56 check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.27"
      # Lint gate (config in ruff.toml), pinned — bump deliberately (0.16 adds new rules; clean them up
      # in a dedicated pass). Daniel lints locally too; this enforces it on every PR.
      - run: uvx ruff@0.15.4 check .
